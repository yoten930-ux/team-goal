<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKEA 團隊交接看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ikea: {
                            blue: '#0058a3',
                            yellow: '#fbd914',
                            darkblue: '#004a87',
                            darkyellow: '#e5c300'
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;900&display=swap');
        html, body {
            max-width: 100%;
            overflow-x: hidden; /* 強制防止畫面左右滑動 */
        }
        body {
            font-family: 'Noto Sans', sans-serif;
            background-color: #f5f5f5;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .modal-enter { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; }
        .markdown-body p { margin-bottom: 0.5rem; }
        .markdown-body strong { font-weight: bold; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden max-w-md mx-auto bg-white shadow-xl relative w-full">

    <div id="identityModal" class="fixed inset-0 bg-black bg-opacity-70 z-[100] hidden flex-col justify-center items-center px-4 backdrop-blur-sm w-full">
        <div class="bg-white rounded-2xl w-full max-w-sm modal-enter overflow-hidden flex flex-col p-6 text-center shadow-2xl border border-gray-100">
            <div class="w-16 h-16 bg-[#e6f0f7] text-ikea-blue rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">
                <i class="fa-solid fa-id-badge"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">請輸入您的姓名或代號</h3>
            <p class="text-sm text-gray-500 mb-6">為了落實交接當責，所有任務與進度回報都將標示您的身分。</p>
            <input type="text" id="identityNameInput" class="w-full border-2 border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-ikea-blue focus:border-ikea-blue outline-none text-center font-bold text-lg mb-3" placeholder="例如：王小明、早班店長">
            
            <div class="mb-5">
                <p class="text-xs text-gray-400 mb-2 text-left">或使用常用代號快速登入：</p>
                <div id="quickNameContainer" class="flex flex-wrap gap-2 justify-center">
                    <!-- JS 動態生成快選按鈕 -->
                </div>
            </div>

            <button onclick="saveIdentity()" class="w-full bg-ikea-blue text-white font-bold py-3.5 rounded-xl shadow-md hover:bg-ikea-darkblue transition active:scale-95 text-lg">
                開始使用
            </button>
        </div>
    </div>

    <div id="toastContainer" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 w-max max-w-[90%] text-center pointer-events-none"></div>

    <header class="bg-ikea-blue text-white p-4 shadow-md flex justify-between items-center z-10 shrink-0 border-b-4 border-ikea-yellow w-full">
        <div>
            <h1 class="text-xl font-black tracking-wide"><i class="fa-solid fa-clipboard-list mr-2"></i>交接任務板</h1>
            <div class="flex items-center gap-2 text-xs text-white opacity-90 mt-1 cursor-pointer bg-ikea-darkblue bg-opacity-80 px-2 py-1 rounded-full w-max hover:bg-opacity-100 transition" onclick="document.getElementById('identityModal').classList.remove('hidden'); document.getElementById('identityModal').classList.add('flex');" title="點擊修改身分">
                <i class="fa-regular fa-user"></i> <span id="displayUserName">未登入</span>
            </div>
        </div>
        <div class="flex gap-3">
            <button onclick="toggleRole()" id="roleBtn" class="p-2 bg-ikea-yellow text-ikea-blue rounded-full w-10 h-10 flex items-center justify-center active:scale-95 transition shadow-sm text-sm font-bold" title="切換權限 (目前: 主管)">
                <i class="fa-solid fa-user-tie"></i>
            </button>
            <button onclick="openSettingsModal()" class="p-2 bg-ikea-darkblue rounded-full w-10 h-10 flex items-center justify-center active:scale-95 transition" title="分類設定">
                <i class="fa-solid fa-gear"></i>
            </button>
            <button onclick="openAIAssistant()" class="p-2 bg-purple-600 rounded-full w-10 h-10 flex items-center justify-center active:scale-95 transition" title="AI 助理">
                <i class="fa-solid fa-sparkles"></i>
            </button>
            <button onclick="openShiftReportsModal()" class="p-2 bg-indigo-600 rounded-full w-10 h-10 flex items-center justify-center active:scale-95 transition" title="歷史交班單">
                <i class="fa-solid fa-file-invoice"></i>
            </button>
        </div>
    </header>

    <div class="bg-white px-4 pt-3 pb-0 shadow-sm shrink-0 z-10 flex flex-col gap-3 w-full">
        <div class="relative w-full">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400"></i>
            <input type="search" id="searchInput" oninput="handleSearch()" class="w-full bg-gray-100 rounded-lg pl-9 pr-3 py-2 outline-none focus:ring-2 focus:ring-ikea-blue text-sm" placeholder="搜尋任務標題、內容、回報或負責人...">
        </div>
        <div class="flex gap-4">
            <button onclick="switchTab('active')" id="tabActive" class="flex-1 pb-2 text-sm font-bold text-ikea-blue border-b-2 border-ikea-blue transition">待辦與進行中</button>
            <button onclick="switchTab('completed')" id="tabCompleted" class="flex-1 pb-2 text-sm font-bold text-gray-400 border-b-2 border-transparent transition">已完成 (歷史封存)</button>
        </div>
    </div>

    <main class="flex-1 overflow-y-auto no-scrollbar p-4 bg-[#f5f5f5] pb-24 w-full" id="taskList">
        <div class="text-center text-gray-400 mt-10" id="emptyState">
            <i class="fa-solid fa-box-open text-4xl mb-3"></i>
            <p>目前沒有待辦事項<br>點擊右下角新增交接任務</p>
        </div>
    </main>

    <button onclick="openAddModal()" class="fixed bottom-6 right-6 lg:right-[calc(50%-13rem)] bg-ikea-yellow text-ikea-blue w-14 h-14 rounded-full shadow-xl flex items-center justify-center text-2xl active:scale-90 transition z-20 hover:bg-ikea-darkyellow font-bold">
        <i class="fa-solid fa-plus"></i>
    </button>

    <div id="addModal" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden flex-col justify-end max-w-md mx-auto w-full">
        <div class="bg-white rounded-t-2xl p-5 h-[85vh] flex flex-col modal-enter w-full">
            <div class="flex justify-between items-center mb-4 shrink-0">
                <h2 class="text-xl font-black text-ikea-blue" id="modalTitle">新增交接事項</h2>
                <button onclick="closeAddModal()" class="text-gray-500 p-2 text-xl hover:text-gray-800"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="overflow-y-auto no-scrollbar flex-1 pb-4 space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">任務標題</label>
                    <input type="text" id="taskTitle" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-ikea-blue focus:border-ikea-blue outline-none" placeholder="例如：補貨 A 區層架">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">指派給 (負責人 / 班別)</label>
                    <!-- 解決 iPhone 無法下拉的問題：改用輸入框 + 下方快速點擊標籤 -->
                    <input type="text" id="taskAssignee" class="w-full border border-gray-300 rounded-lg p-3 mb-2 focus:ring-2 focus:ring-ikea-blue focus:border-ikea-blue outline-none bg-white" placeholder="點擊下方標籤，或直接輸入名稱">
                    <div id="assigneeQuickSelect" class="flex flex-wrap gap-2">
                        <!-- JS 動態生成快速選擇標籤 -->
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">任務區域 (Zone)</label>
                        <select id="taskZone" class="w-full border border-gray-300 rounded-lg p-3 bg-white focus:ring-2 focus:ring-ikea-blue focus:border-ikea-blue outline-none">
                            <!-- JS 動態產生選項 -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">任務屬性</label>
                        <div class="flex flex-col gap-2 mt-2">
                            <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
                                <input type="checkbox" id="taskIsManager" class="w-4 h-4 text-ikea-blue rounded focus:ring-ikea-blue" onchange="handleManagerToggle()">
                                <span class="font-bold text-red-600">👑 主管交辦</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
                                <input type="checkbox" id="taskRequireProof" class="w-4 h-4 text-ikea-blue rounded focus:ring-ikea-blue">
                                <span>📸 需照片完工證明</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2 flex justify-between items-center">
                        <span>任務分類</span>
                        <button type="button" onclick="openSettingsModal()" class="text-xs text-ikea-blue bg-[#e6f0f7] px-2 py-1 rounded-md border border-blue-100 hover:bg-blue-100 transition"><i class="fa-solid fa-pen"></i> 自訂分類</button>
                    </label>
                    <div id="dynamicCategorySelection" class="flex flex-wrap gap-2">
                        <!-- JS 動態生成 -->
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1 flex justify-between items-center">
                        <span>詳細內容</span>
                        <div class="flex gap-2">
                            <button type="button" id="micBtn" onclick="toggleVoiceInput('taskDesc')" class="text-ikea-blue flex items-center gap-1 text-xs bg-[#e6f0f7] px-2 py-1 rounded border border-blue-100 active:bg-blue-100 transition font-bold">
                                <i class="fa-solid fa-microphone"></i> 說話
                            </button>
                            <button type="button" id="aiRefineBtn" onclick="refineTaskDescWithAI()" class="text-purple-600 flex items-center gap-1 text-xs bg-purple-50 px-2 py-1 rounded border border-purple-100 active:bg-purple-100 transition font-bold" title="AI 自動整理口語內容">
                                <i class="fa-solid fa-wand-magic-sparkles"></i> AI 整理
                            </button>
                        </div>
                    </label>
                    <textarea id="taskDesc" rows="3" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-ikea-blue focus:border-ikea-blue outline-none" placeholder="描述需要交接的細節..."></textarea>
                    <p id="voiceStatus" class="text-xs text-red-500 hidden mt-1 font-bold">正在聆聽中... (請說話)</p>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">重要程度</label>
                        <select id="taskPriority" class="w-full border border-gray-300 rounded-lg p-3 bg-white focus:ring-2 focus:ring-ikea-blue focus:border-ikea-blue outline-none">
                            <option value="3">🔥 緊急 (最優先)</option>
                            <option value="2" selected>⚡ 一般</option>
                            <option value="1">🌱 不急 (有空做)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">截止日期</label>
                        <input type="date" id="taskDueDate" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-ikea-blue focus:border-ikea-blue outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">上傳現場照片</label>
                    <div class="flex items-center justify-center w-full">
                        <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 relative overflow-hidden">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6" id="uploadPlaceholder">
                                <i class="fa-solid fa-camera text-3xl text-gray-400 mb-2"></i>
                                <p class="text-sm text-gray-500 font-medium">點擊拍照或選擇照片</p>
                            </div>
                            <img id="imagePreview" class="absolute inset-0 w-full h-full object-cover hidden">
                            <input type="file" id="taskImage" class="hidden" accept="image/*" onchange="previewImage(event)" />
                        </label>
                    </div>
                </div>
            </div>

            <div class="pt-4 border-t shrink-0">
                <button onclick="saveTask()" class="w-full bg-ikea-blue text-white font-bold py-3 rounded-xl active:bg-ikea-darkblue transition text-lg shadow-md tracking-widest">
                    儲存任務
                </button>
            </div>
        </div>
    </div>

    <div id="detailModal" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden flex-col justify-end max-w-md mx-auto w-full">
        <div class="bg-white rounded-t-2xl h-[90vh] flex flex-col modal-enter relative w-full">
            
            <div id="detailHeader" class="h-40 bg-gray-200 rounded-t-2xl relative overflow-hidden shrink-0">
                <img id="detailImage" class="w-full h-full object-cover hidden">
                <div id="detailNoImage" class="w-full h-full flex items-center justify-center bg-[#e6f0f7] text-[#99c2e0] text-5xl">
                    <i class="fa-solid fa-image"></i>
                </div>
                <div class="absolute top-4 right-4 flex gap-2">
                    <button onclick="openEditModal()" class="bg-[#e6f0f7] bg-opacity-90 text-ikea-blue rounded-full w-8 h-8 flex items-center justify-center hover:bg-blue-200 transition shadow" title="編輯任務"><i class="fa-solid fa-pen text-sm"></i></button>
                    <button onclick="deleteCurrentTask()" class="bg-red-500 bg-opacity-90 text-white rounded-full w-8 h-8 flex items-center justify-center hover:bg-red-600 transition shadow" title="刪除任務"><i class="fa-solid fa-trash-can text-sm"></i></button>
                    <button onclick="closeDetailModal()" class="bg-black bg-opacity-50 text-white rounded-full w-8 h-8 flex items-center justify-center shadow"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="detailPriorityBadge" class="absolute bottom-3 left-4 px-3 py-1 rounded-full text-xs font-bold text-white shadow tracking-wide"></div>
            </div>

            <div class="p-5 overflow-y-auto no-scrollbar flex-1 pb-24">
                <h2 id="detailTitle" class="text-2xl font-black mb-2 text-gray-800"></h2>
                <div class="flex text-sm text-gray-500 mb-4 gap-4 items-center flex-wrap">
                    <span id="detailCategoryBadge"></span>
                    <span id="detailAssigneeBadge" class="hidden px-2 py-1 bg-indigo-50 text-indigo-600 border border-indigo-100 rounded-full text-xs font-bold"><i class="fa-solid fa-user-astronaut mr-1"></i> <span id="detailAssigneeText"></span></span>
                    <span class="font-medium"><i class="fa-regular fa-calendar mr-1"></i> <span id="detailDueDate"></span></span>
                </div>
                
                <div class="mb-4 bg-white p-3 rounded-xl border border-gray-200 flex justify-between items-center shadow-sm">
                    <span class="text-sm font-bold text-gray-700">任務狀態</span>
                    <div class="flex gap-1 flex-wrap justify-end" id="statusControlGroup">
                        <button onclick="changeTaskStatus('pending')" id="btnStatusPending" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition">未處理</button>
                        <button onclick="changeTaskStatus('in_progress')" id="btnStatusProgress" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition">處理中</button>
                        <button onclick="attemptReviewTask()" id="btnStatusReview" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition hidden">待主管確認</button>
                        <button onclick="attemptCompleteTask()" id="btnStatusCompleted" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition">已完成</button>
                        <input type="file" id="proofUploadInput" class="hidden" accept="image/*" onchange="uploadCompletionProof(event)" />
                    </div>
                </div>

                <div id="completionProofContainer" class="hidden mb-4 p-3 bg-green-50 border border-green-200 rounded-xl">
                    <h3 class="text-sm font-bold text-green-800 mb-2"><i class="fa-solid fa-check-circle mr-1"></i>完工證明</h3>
                    <img id="completionProofImage" class="w-full h-32 object-cover rounded-lg border border-green-300">
                </div>

                <p id="detailDesc" class="text-gray-700 whitespace-pre-wrap bg-gray-50 p-3 rounded-lg leading-relaxed"></p>

                <!-- 簽收區塊 -->
                <div class="mt-4 border-t pt-4 border-gray-100">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-bold text-gray-800 text-sm"><i class="fa-solid fa-eye mr-1 text-ikea-blue"></i> 任務簽收 / 已知悉</h3>
                        <button onclick="acknowledgeTask()" class="text-xs bg-[#e6f0f7] text-ikea-blue border border-blue-200 hover:bg-blue-100 px-3 py-1.5 rounded-full font-bold transition active:scale-95 shadow-sm">我已知悉接手</button>
                    </div>
                    <div id="ackList" class="flex flex-wrap gap-2 text-xs"></div>
                </div>

                <!-- 進度回報區塊 -->
                <div class="mt-4 border-t pt-4 border-gray-100 flex-1 flex flex-col">
                    <h3 class="font-bold text-gray-800 text-sm mb-2"><i class="fa-solid fa-list-check mr-1 text-ikea-blue"></i> 任務進度與留言</h3>
                    <div id="progressList" class="flex-1 overflow-y-auto no-scrollbar mb-2 space-y-2 pb-2"></div>
                    <div class="flex gap-2 shrink-0">
                        <button type="button" onclick="toggleVoiceInput('progressInput')" class="text-ikea-blue bg-[#e6f0f7] w-10 h-10 rounded-lg border border-blue-100 active:bg-blue-100 transition flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                        <input type="text" id="progressInput" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-ikea-blue focus:border-ikea-blue outline-none" placeholder="回報進度或補充說明...">
                        <button onclick="addProgress()" class="bg-ikea-blue text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-ikea-darkblue transition active:scale-95 shrink-0"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex-col justify-center items-center px-4 w-full">
        <div class="bg-white rounded-2xl w-full max-w-sm modal-enter overflow-hidden flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center p-4 border-b bg-gray-50 shrink-0">
                <h2 class="text-lg font-black text-ikea-blue"><i class="fa-solid fa-gear mr-2"></i>系統設定</h2>
                <button onclick="closeSettingsModal()" class="text-gray-500 p-2 text-xl hover:text-gray-800"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-4 overflow-y-auto no-scrollbar flex-1 space-y-6">
                
                <div>
                    <h3 class="text-sm font-bold text-gray-700 mb-3 flex items-center"><i class="fa-solid fa-tags text-ikea-blue mr-2"></i>任務分類管理</h3>
                    <div id="categoryManagerList" class="space-y-2 mb-3">
                        <!-- 動態渲染目前分類 -->
                    </div>
                    <div class="bg-gray-50 p-3 rounded-xl border border-gray-200">
                        <label class="block text-xs font-bold text-gray-600 mb-2">新增分類</label>
                        <div class="flex gap-2 mb-2">
                            <input type="text" id="newCategoryName" class="flex-1 border border-gray-300 rounded-lg p-2 text-sm outline-none focus:border-ikea-blue" placeholder="分類名稱 (如: 突發狀況)">
                            <select id="newCategoryColor" class="border border-gray-300 rounded-lg p-2 text-sm outline-none focus:border-ikea-blue bg-white font-medium">
                                <option value="purple">紫標</option>
                                <option value="blue">藍標</option>
                                <option value="orange">橘標</option>
                                <option value="emerald">綠標</option>
                                <option value="pink">粉標</option>
                                <option value="gray">灰標</option>
                            </select>
                        </div>
                        <button onclick="addNewCategory()" class="w-full bg-[#e6f0f7] hover:bg-blue-100 text-ikea-blue border border-blue-200 font-bold py-2 rounded-lg transition text-sm">
                            <i class="fa-solid fa-plus mr-1"></i> 新增
                        </button>
                    </div>
                </div>

                <div>
                    <h3 class="text-sm font-bold text-gray-700 mb-3 flex items-center"><i class="fa-solid fa-users text-ikea-blue mr-2"></i>快速登入代號管理</h3>
                    <div id="quickNameManagerList" class="flex flex-wrap gap-2 mb-3">
                        <!-- 動態渲染 -->
                    </div>
                    <div class="bg-gray-50 p-3 rounded-xl border border-gray-200">
                        <label class="block text-xs font-bold text-gray-600 mb-2">新增常用代號</label>
                        <div class="flex gap-2">
                            <input type="text" id="newQuickName" class="flex-1 border border-gray-300 rounded-lg p-2 text-sm outline-none focus:border-ikea-blue" placeholder="例如: 大夜班店長">
                            <button onclick="addNewQuickName()" class="bg-[#e6f0f7] hover:bg-blue-100 text-ikea-blue border border-blue-200 font-bold px-4 py-2 rounded-lg transition text-sm whitespace-nowrap">
                                新增
                            </button>
                        </div>
                    </div>
                </div>
                
                <div>
                    <h3 class="text-sm font-bold text-gray-700 mb-3 flex items-center"><i class="fa-solid fa-user-tag text-ikea-blue mr-2"></i>常見指派對象管理</h3>
                    <div id="assigneeManagerList" class="flex flex-wrap gap-2 mb-3">
                        <!-- 動態渲染 -->
                    </div>
                    <div class="bg-gray-50 p-3 rounded-xl border border-gray-200">
                        <label class="block text-xs font-bold text-gray-600 mb-2">新增指派對象</label>
                        <div class="flex gap-2">
                            <input type="text" id="newAssigneeInput" class="flex-1 border border-gray-300 rounded-lg p-2 text-sm outline-none focus:border-ikea-blue" placeholder="例如: 倉管部、早班值星">

        function escapeHTML(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }

        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `px-4 py-2 rounded-lg shadow-lg text-white text-sm font-bold modal-enter ${isError ? 'bg-red-500' : 'bg-gray-800'}`;
            toast.textContent = message;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 3000);

        function writeAuditLog(taskId, action, details) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.logCount = (task.logCount || 0) + 1;
                if (!task.recentLogs) task.recentLogs = [];
                task.recentLogs.push({ action: action, details: details, user: currentUserName });
                if (task.recentLogs.length > 3) {
                    task.recentLogs.shift();
                }
            }

            const logData = {
                action: action,
                details: details,
                user: currentUserName,
                timestamp: new Date().toISOString()
            };

            if (window.fbAppendAuditLog) {
                window.fbAppendAuditLog(taskId, logData);
            }
        }

        let confirmActionCallback = null;

            saveIdentity(); 
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'zh-TW';
        }

        function toggleVoiceInput(targetInputId) {
            if (!recognition) { showToast("瀏覽器不支援語音輸入", true); return; }
            if (isRecognizing) return; 
            
            const targetInput = document.getElementById(targetInputId);
            const statusText = document.getElementById('voiceStatus');
            if (statusText) statusText.classList.remove('hidden');

            try { recognition.start(); isRecognizing = true; } catch (e) { console.warn(e); }

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                if(targetInput.tagName === 'TEXTAREA') targetInput.value += (targetInput.value ? '\n' : '') + transcript;
                else targetInput.value += transcript;
                if (statusText) statusText.classList.add('hidden');
            };
            recognition.onerror = () => { if (statusText) statusText.classList.add('hidden'); showToast("語音辨識失敗", true); isRecognizing = false; };
            recognition.onend = () => { if (statusText) statusText.classList.add('hidden'); isRecognizing = false; };
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > height) { if (width > 800) { height *= 800 / width; width = 800; } } 
                        else { if (height > 800) { width *= 800 / height; height = 800; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        selectedImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        document.getElementById('imagePreview').src = selectedImageBase64;
                        document.getElementById('imagePreview').classList.remove('hidden');
                        document.getElementById('uploadPlaceholder').classList.add('hidden');
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function handleManagerToggle() {
            if (document.getElementById('taskIsManager').checked) document.getElementById('taskRequireProof').checked = true;
        }

        function openAddModal() {
            isEditingMode = false;
            document.getElementById('modalTitle').textContent = '新增交接事項';
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDesc').value = '';
            document.getElementById('taskPriority').value = '2';
            document.getElementById('taskAssignee').value = ''; 
            
            renderZonesSelect('taskZone');
            
            document.getElementById('taskIsManager').checked = false;
            document.getElementById('taskRequireProof').checked = false;

        function openEditModal() {
            if(!currentEditingTaskId) return;
            const task = tasks.find(t => t.id === currentEditingTaskId);
            if(!task) return;
            
            if (task.isManagerTask && currentUserRole !== 'manager') {
                showToast("權限不足：一般同仁無法編輯主管交辦任務", true);
                return;
            }
            
            isEditingMode = true;
            document.getElementById('modalTitle').textContent = '編輯交接事項';
            document.getElementById('taskTitle').value = task.title;
            document.getElementById('taskDesc').value = task.description;
            document.getElementById('taskPriority').value = task.priority;
            document.getElementById('taskAssignee').value = task.assignee || '';
            
            renderZonesSelect('taskZone');
            const zoneSelectEl = document.getElementById('taskZone');
            const taskZoneValue = task.zone || (zones.length > 0 ? zones[0] : '');
            if (taskZoneValue && !zones.includes(taskZoneValue)) {
                const opt = document.createElement('option');
                opt.value = taskZoneValue;
                opt.textContent = `${taskZoneValue} (已刪除)`;
                zoneSelectEl.appendChild(opt);
            }
            zoneSelectEl.value = taskZoneValue;

            document.getElementById('taskIsManager').checked = task.isManagerTask;
            document.getElementById('taskRequireProof').checked = task.requireProof;
            document.getElementById('taskDueDate').value = task.dueDate || '';
            
            const catRadio = document.querySelector(`input[name="taskCategory"][value="${task.category}"]`);
            if(catRadio) catRadio.checked = true;
            
            selectedImageBase64 = task.image;
            if(task.image) {
                document.getElementById('imagePreview').src = task.image;
                document.getElementById('imagePreview').classList.remove('hidden');
                document.getElementById('uploadPlaceholder').classList.add('hidden');
            } else {
                document.getElementById('imagePreview').src = '';
                document.getElementById('imagePreview').classList.add('hidden');
                document.getElementById('uploadPlaceholder').classList.remove('hidden');

            document.getElementById('addModal').classList.remove('hidden');
            document.getElementById('addModal').classList.add('flex');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
            document.getElementById('addModal').classList.remove('flex');

        let currentAuditLogUnsubscribe = null;

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
            document.getElementById('detailModal').classList.remove('flex');
            currentEditingTaskId = null;
            if (currentAuditLogUnsubscribe) {
                currentAuditLogUnsubscribe();
                currentAuditLogUnsubscribe = null;
            }
        }

        function saveTask() {
            if (isSaving) return;
            isSaving = true;

            const title = document.getElementById('taskTitle').value.trim();
            const desc = document.getElementById('taskDesc').value.trim();
            const priority = parseInt(document.getElementById('taskPriority').value);
            const dueDate = document.getElementById('taskDueDate').value;
            const assignee = document.getElementById('taskAssignee').value.trim(); 
            const zone = document.getElementById('taskZone').value;
            const isManagerTask = document.getElementById('taskIsManager').checked;
            const requireProof = document.getElementById('taskRequireProof').checked;
            
            const categoryInput = document.querySelector('input[name="taskCategory"]:checked');
            const category = categoryInput ? categoryInput.value : (categories.length > 0 ? categories[0].id : 'default');

            if (!title) {
                showToast("請填寫任務標題！", true);
                isSaving = false;
                return;
            }

            if (isEditingMode) {
                const task = tasks.find(t => t.id === currentEditingTaskId);
                if (task) {
                    let changes = [];
                    if(task.title !== title) changes.push('標題');
                    if(task.description !== desc) changes.push('內容');
                    if(task.assignee !== assignee) changes.push('指派人');
                    if(task.dueDate !== dueDate) changes.push('到期日');
                    if(task.priority !== priority) changes.push('重要程度');
                    if(task.zone !== zone) changes.push('區域');
                    if(task.isManagerTask !== isManagerTask) changes.push('主管交辦標記');
                    if(task.requireProof !== requireProof) changes.push('照片證明要求');
                    if(task.category !== category) changes.push('分類');
                    
                    if (changes.length > 0) writeAuditLog(task.id, '編輯', `修改了任務資訊: ${changes.join(', ')}`);

                    task.title = title; task.description = desc; task.priority = priority; task.dueDate = dueDate;
                    task.assignee = assignee; task.zone = zone; task.isManagerTask = isManagerTask; task.requireProof = requireProof;
                    task.category = category; task.image = selectedImageBase64;
                    
                    if (window.fbUpdateTask) window.fbUpdateTask(task).catch(e => showToast("更新失敗", true));
                    closeAddModal(); openTaskDetail(task.id); renderTasks(); showToast("更新成功！");
                }
                isSaving = false; return;
            }

            const newTask = {
                id: Date.now().toString(), title: title, description: desc, priority: priority, category: category,
                assignee: assignee, zone: zone, isManagerTask: isManagerTask, requireProof: requireProof, completionImage: null, 
                dueDate: dueDate, image: selectedImageBase64, createdAt: new Date().toISOString(), createdBy: currentUserName,
                status: 'pending', logCount: 1, recentLogs: [{action: '建立', details: '建立了此任務', user: currentUserName}], acknowledgements: []
            };

            if (window.fbSaveTask) {
                window.fbSaveTask(newTask).then(() => {
                    if (window.fbAppendAuditLog) {
                        window.fbAppendAuditLog(newTask.id, {
                            action: '建立', details: '建立了此任務', user: currentUserName, timestamp: new Date().toISOString()
                        });
                    }
                    closeAddModal(); isSaving = false; showToast("任務建立成功！");
                }).catch(err => { showToast("儲存失敗", true); isSaving = false; });
            } else {
                tasks.push(newTask); 
                closeAddModal(); renderTasks(); isSaving = false; showToast("任務建立成功！");
            }
        }

        function handleSearch() { searchQuery = document.getElementById('searchInput').value.trim().toLowerCase(); renderTasks(); }
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabActive').className = tab === 'active' ? "flex-1 pb-2 text-sm font-bold text-ikea-blue border-b-2 border-ikea-blue transition" : "flex-1 pb-2 text-sm font-bold text-gray-400 border-b-2 border-transparent transition";
            document.getElementById('tabCompleted').className = tab === 'completed' ? "flex-1 pb-2 text-sm font-bold text-ikea-blue border-b-2 border-ikea-blue transition" : "flex-1 pb-2 text-sm font-bold text-gray-400 border-b-2 border-transparent transition";
            renderTasks();
        }

        function renderTasks() {
            const taskList = document.getElementById('taskList');
            const emptyState = document.getElementById('emptyState');

            const filteredTasks = tasks.filter(task => {
                if (task.isDeleted) return false;
                if (currentTab === 'active' && task.status === 'completed') return false;
                if (currentTab === 'completed' && task.status !== 'completed') return false;
                if (searchQuery) {
                    const recentCommentsStr = task.recentLogs ? task.recentLogs.map(l => l.details).join(' ') : '';
                    const searchStr = `${task.title} ${task.description || ''} ${task.assignee || ''} ${recentCommentsStr}`.toLowerCase();
                    if (!searchStr.includes(searchQuery)) return false;
                }
                return true;
            });

            if (filteredTasks.length === 0) {
                taskList.innerHTML = '';
                if(searchQuery) emptyState.querySelector('p').innerHTML = '找不到符合搜尋條件的任務';
                else if(currentTab === 'completed') emptyState.querySelector('p').innerHTML = '目前沒有已完成的任務';
                else emptyState.querySelector('p').innerHTML = '目前沒有待辦事項<br>點擊右下角新增交接任務';
                taskList.appendChild(emptyState);
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            taskList.innerHTML = '';

            const today = new Date(); today.setHours(0, 0, 0, 0);
            const isOverdue = (task) => {
                if (task.status === 'completed' || !task.dueDate) return false;
                return new Date(task.dueDate) < today;
            };

            const sortedTasks = [...filteredTasks].sort((a, b) => {
                const aOverdue = isOverdue(a), bOverdue = isOverdue(b);
                if (aOverdue && !bOverdue) return -1;
                if (!aOverdue && bOverdue) return 1;
                if (a.priority !== b.priority) return b.priority - a.priority;
                const getValidTime = (dateStr) => { if (!dateStr) return Infinity; const t = new Date(dateStr).getTime(); return isNaN(t) ? Infinity : t; };
                return getValidTime(a.dueDate) - getValidTime(b.dueDate);
            });

            sortedTasks.forEach(task => {
                const isTaskOverdue = isOverdue(task);
                const card = document.createElement('div');
                let cardStyle = isTaskOverdue ? "bg-red-50 rounded-xl shadow-sm border border-red-300" : "bg-white rounded-xl shadow-sm border border-gray-100";
                let cardOpacity = task.status === 'completed' ? 'opacity-60 grayscale-[30%]' : 'opacity-100';
                
                card.className = `${cardStyle} p-4 mb-3 active:scale-[0.98] transition cursor-pointer relative overflow-hidden ${cardOpacity}`;
                card.onclick = () => openTaskDetail(task.id);

                let priorityColor = "bg-gray-400", priorityIcon = "";
                if (isTaskOverdue) { priorityColor = "bg-red-600"; priorityIcon = "⚠️"; }
                else if (task.priority === 3) { priorityColor = "bg-red-500"; priorityIcon = "🔥"; }
                else if (task.priority === 2) { priorityColor = "bg-yellow-400"; priorityIcon = "⚡"; }
                else if (task.priority === 1) { priorityColor = "bg-green-500"; priorityIcon = "🌱"; }

                const dateObj = new Date(task.dueDate);
                const dateStr = task.dueDate ? `${dateObj.getMonth()+1}/${dateObj.getDate()}` : '無期限';
                const catInfo = categories.find(c => c.id === task.category) || { label: '已刪除分類', color: 'gray' };
                const theme = COLOR_THEMES[catInfo.color] || COLOR_THEMES['gray'];
                const categoryBadge = `<span class="text-xs px-2 py-0.5 rounded-full border ${theme.badge} font-bold whitespace-nowrap">${escapeHTML(catInfo.label)}</span>`;
                const assigneeBadge = task.assignee ? `<span class="text-xs bg-indigo-50 text-indigo-600 border border-indigo-100 px-2 py-0.5 rounded font-bold whitespace-nowrap"><i class="fa-solid fa-user-astronaut"></i> ${escapeHTML(task.assignee)}</span>` : '';
                const zoneBadge = task.zone && task.zone !== '不分區' ? `<span class="text-xs bg-cyan-50 text-cyan-700 border border-cyan-200 px-2 py-0.5 rounded font-bold whitespace-nowrap"><i class="fa-solid fa-location-dot"></i> ${escapeHTML(task.zone)}</span>` : '';
                const managerBadge = task.isManagerTask ? `<span class="text-xs bg-red-100 text-red-700 border border-red-200 px-2 py-0.5 rounded font-black whitespace-nowrap">👑 主管交辦</span>` : '';
                const overdueBadge = isTaskOverdue ? `<span class="text-xs bg-red-600 text-white px-2 py-0.5 rounded font-black whitespace-nowrap animate-pulse">逾期</span>` : '';

                let statusIcon = '<span class="text-xs bg-gray-100 text-gray-600 border border-gray-200 px-2 py-0.5 rounded font-bold whitespace-nowrap">⚪ 未處理</span>';
                if(task.status === 'in_progress') statusIcon = '<span class="text-xs bg-blue-50 text-[#0058a3] border-blue-200 px-2 py-0.5 rounded font-bold whitespace-nowrap">🔵 處理中</span>';
                if(task.status === 'pending_review') statusIcon = '<span class="text-xs bg-purple-50 text-purple-600 border border-purple-200 px-2 py-0.5 rounded font-bold whitespace-nowrap animate-pulse">👀 待確認</span>';
                if(task.status === 'completed') statusIcon = '<span class="text-xs bg-green-50 text-green-600 border border-green-200 px-2 py-0.5 rounded font-bold whitespace-nowrap">🟢 已完成</span>';

                let imgThumbnail = task.image ? `<div class="w-16 h-16 rounded-lg ml-3 shrink-0"><img src="${escapeHTML(task.image)}" class="w-full h-full object-cover rounded-lg"></div>` : "";

                card.innerHTML = `
                    <div class="absolute left-0 top-0 bottom-0 w-1.5 ${priorityColor}"></div>
                    <div class="flex justify-between items-start pl-2">
                        <div class="flex-1 min-w-0 pr-2">
                            <div class="flex items-center gap-1.5 mb-2 flex-wrap">
                                ${overdueBadge} ${managerBadge}
                                <span class="text-xs bg-gray-100 px-2 py-0.5 rounded text-gray-600 font-bold whitespace-nowrap">${priorityIcon} ${task.priority === 3 ? '緊急' : task.priority === 2 ? '一般' : '不急'}</span>
                                ${categoryBadge} ${zoneBadge} ${statusIcon} ${assigneeBadge}
                                <span class="text-xs ${isTaskOverdue ? 'text-red-600 font-bold' : 'text-red-500 font-bold'} ml-auto whitespace-nowrap"><i class="fa-regular fa-clock"></i> ${escapeHTML(dateStr)}</span>
                            </div>
                            <h3 class="font-black text-gray-800 text-lg leading-tight mb-1 truncate">${escapeHTML(task.title)}</h3>
                            <p class="text-gray-500 text-sm line-clamp-1 font-medium">${escapeHTML(task.description || '無詳細說明')}</p>
                            <div class="mt-2 text-xs text-ikea-blue font-bold tracking-wide">
                                <i class="fa-regular fa-comments"></i> ${task.logCount || 0} 則互動紀錄 ${task.requireProof ? ' | 📸 需照片' : ''} ${task.acknowledgements && task.acknowledgements.length > 0 ? ` | 👀 ${task.acknowledgements.length} 人已讀` : ''}
                            </div>
                        </div>
                        ${imgThumbnail}
                    </div>
                `;
                taskList.appendChild(card);
            });
        }

        function updateStatusButtonsUI(status) {
            const btnP = document.getElementById('btnStatusPending'), btnI = document.getElementById('btnStatusProgress');
            const btnR = document.getElementById('btnStatusReview'), btnC = document.getElementById('btnStatusCompleted');
            const task = tasks.find(t => t.id === currentEditingTaskId);
            const baseClass = "px-3 py-1.5 rounded-lg text-xs font-bold border transition shadow-sm active:scale-95";
            const inactive = "bg-white text-gray-500 border-gray-200 hover:bg-gray-50";
            
            btnP.className = `${baseClass} ${inactive}`; btnI.className = `${baseClass} ${inactive}`;
            btnR.className = `${baseClass} ${inactive} hidden`; btnC.className = `${baseClass} ${inactive} hidden`;

            if (task && task.isManagerTask) {
                btnR.classList.remove('hidden');
                if (currentUserRole === 'manager') btnC.classList.remove('hidden');
            } else { btnC.classList.remove('hidden'); }
            
            if(status === 'pending') btnP.className = `${baseClass} bg-gray-600 text-white border-gray-600 shadow-inner`;
            if(status === 'in_progress') btnI.className = `${baseClass} bg-ikea-blue text-white border-ikea-blue shadow-inner`;
            if(status === 'pending_review') btnR.className = `${baseClass} bg-purple-600 text-white border-purple-600 shadow-inner`;
            if(status === 'completed') btnC.className = `${baseClass} bg-green-500 text-white border-green-500 shadow-inner`;
        }

        function changeTaskStatus(newStatus) {
            if(!currentEditingTaskId) return;
            const task = tasks.find(t => t.id === currentEditingTaskId);
            if(task) {
                const oldStatus = task.status;
                if (oldStatus === newStatus) return; 

                task.status = newStatus;
                const statusNames = { 'pending': '未處理', 'in_progress': '處理中', 'pending_review': '待主管確認', 'completed': '已完成' };
                writeAuditLog(task.id, '狀態變更', `將狀態變更為 [${statusNames[newStatus]}]`);

                if (window.fbUpdateTask) window.fbUpdateTask(task).catch(e => showToast("更新狀態失敗", true));
                
                updateStatusButtonsUI(newStatus); renderTasks(); 
                
                if (newStatus !== 'completed' && newStatus !== 'pending_review') {
                    document.getElementById('completionProofContainer').classList.add('hidden');
                } else if (task.completionImage) {
                    document.getElementById('completionProofImage').src = task.completionImage;
                    document.getElementById('completionProofContainer').classList.remove('hidden');
                } else {
                    document.getElementById('completionProofContainer').classList.add('hidden');
                }
            }
        }

            if(!currentEditingTaskId) return;
            const task = tasks.find(t => t.id === currentEditingTaskId);
            if(task) {
                if (task.requireProof && !task.completionImage) {
                    showToast("此任務要求提供「完工證明照片」，請拍攝或選擇照片！", true);
                    pendingProofAction = 'completed'; document.getElementById('proofUploadInput').click();

        function attemptReviewTask() {
            if(!currentEditingTaskId) return;

            if(task) {
                if (task.requireProof && !task.completionImage) {
                    showToast("送出審核前要求提供「完工證明照片」，請拍攝！", true);
                    pendingProofAction = 'pending_review'; document.getElementById('proofUploadInput').click();

        function acknowledgeTask() {
            if(!currentEditingTaskId) return;
            const task = tasks.find(t => t.id === currentEditingTaskId);
            if(task) {
                if(!task.acknowledgements) task.acknowledgements = [];
                if(task.acknowledgements.find(a => a.user === currentUserName)) { showToast("您已經簽收過此任務了"); return; }
                
                task.acknowledgements.push({ user: currentUserName, timestamp: new Date().toISOString() });
                writeAuditLog(task.id, '簽收', `已知悉並接手此任務`);
                
                if (window.fbUpdateTask) window.fbUpdateTask(task).catch(e=>console.error(e));
                renderAcknowledgements(task); renderTasks(); showToast("簽收成功！");
            }
        }

        function renderAcknowledgements(task) {
            const list = document.getElementById('ackList');
            if(!task.acknowledgements || task.acknowledgements.length === 0) { list.innerHTML = `<span class="text-gray-400 font-bold">尚未有人簽收</span>`; return; }
            list.innerHTML = task.acknowledgements.map(a => `<span class="bg-gray-100 text-gray-700 px-2 py-1 rounded border border-gray-200 shadow-sm font-bold"><i class="fa-solid fa-check text-green-500 mr-1"></i>${escapeHTML(a.user)}</span>`).join('');
        }

        function uploadCompletionProof(event) {
            const file = event.target.files[0];
            if (!file || !currentEditingTaskId) return;
            showToast("正在上傳完工照片...");
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > 800) { height *= 800 / width; width = 800; } } 
                    else { if (height > 800) { width *= 800 / height; height = 800; } }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    const base64 = canvas.toDataURL('image/jpeg', 0.7);
                    
                    const task = tasks.find(t => t.id === currentEditingTaskId);
                    if (task) {
                        task.completionImage = base64;
                        writeAuditLog(task.id, '上傳', "上傳了完工證明照片");
                        if (pendingProofAction === 'pending_review') changeTaskStatus('pending_review'); else changeTaskStatus('completed');
                        pendingProofAction = null; showToast("已成功提交完工證明！");
                    }
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        async function callGeminiAPI(prompt, systemInstruction = "") {
            const aiLoading = document.getElementById('aiLoading'), aiResultContainer = document.getElementById('aiResultContainer'), aiResult = document.getElementById('aiResult');
            aiLoading.classList.remove('hidden'); aiLoading.classList.add('flex'); aiResultContainer.classList.add('hidden');
            
            if (!GEMINI_API_KEY || GEMINI_API_KEY === "請在這裡貼上你的Gemini金鑰") {
                aiLoading.classList.add('hidden'); aiLoading.classList.remove('flex');
                showToast("請先在程式碼中填寫 Gemini API Key！", true);
                return;
            }

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };
            if (systemInstruction) payload.systemInstruction = { parts: [{ text: systemInstruction }] };

            try {
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await response.json();
                aiLoading.classList.add('hidden'); aiLoading.classList.remove('flex');
                if (data.candidates && data.candidates.length > 0) {
                    aiResult.innerHTML = formatMarkdown(data.candidates[0].content.parts[0].text);
                    aiResultContainer.classList.remove('hidden');
                    if (currentAITask === 'shift_report') {
                        const btn = document.getElementById('saveShiftReportBtn');
                        btn.classList.remove('hidden'); btn.innerHTML = '<i class="fa-solid fa-box-archive mr-1"></i> 封存為正式交班紀錄'; btn.disabled = false; btn.classList.remove('bg-green-500'); btn.classList.add('bg-purple-600');
                    } else { document.getElementById('saveShiftReportBtn').classList.add('hidden'); }
                } else { aiResult.innerHTML = "<p class='text-red-500'>AI 無法產生回應。</p>"; aiResultContainer.classList.remove('hidden'); }
            } catch (error) { aiLoading.classList.add('hidden'); aiLoading.classList.remove('flex'); aiResult.innerHTML = "<p class='text-red-500'>發生錯誤，請檢查 API Key 是否正確。</p>"; aiResultContainer.classList.remove('hidden'); }
        }

        function formatMarkdown(text) {
            let fText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
            fText = fText.replace(/(?:^|<br>)\* (.*?)(?=(?:<br>\* |$))/g, '<ul><li>$1</li></ul>').replace(/<\/ul><ul>/g, ''); 
            return `<p>${fText}</p>`;
        }

        function summarizeTasks() {
            if (tasks.length === 0) { document.getElementById('aiResult').innerHTML = "<p>目前沒有任務可以摘要。</p>"; document.getElementById('aiResult').classList.remove('hidden'); return; }
            const taskData = tasks.map(t => {
                const catInfo = categories.find(c => c.id === t.category) || { label: '未分類' };
                const recentComments = t.recentLogs ? t.recentLogs.map(l => `[${l.user}]: ${l.details}`).join(' | ') : '無';
                return `任務: ${t.title} \n分類: ${catInfo.label} \n優先級: ${t.priority===3?'緊急':t.priority===2?'一般':'不急'} \n期限: ${t.dueDate||'無'}\n描述: ${t.description}\n進度數: ${t.logCount || 0}\n最近動態: ${recentComments}`;
            }).join('\n\n');
            currentAITask = 'summary';
            callGeminiAPI(`這是目前的交接任務清單：\n\n${taskData}`, `你是一位專業的交班助理。請閱讀目前的任務清單，並用簡短、活潑的語氣提供整體任務的摘要報告。`);
        }

        function generateShiftReport() {
            if (tasks.length === 0) { document.getElementById('aiResult').innerHTML = "<p>目前沒有任務，無法產生交班報告。</p>"; document.getElementById('aiResult').classList.remove('hidden'); return; }
            const today = new Date(); today.setHours(0,0,0,0);
            const activeTasks = tasks.filter(t => t.status !== 'completed');
            const taskData = activeTasks.map(t => {
                const isOverdue = t.dueDate && (new Date(t.dueDate) < today);
                const recentComments = t.recentLogs ? t.recentLogs.map(l => `[${l.user}]: ${l.details}`).join(' | ') : '無';
                return `[${t.zone || '不分區'}] ${t.title} (指派: ${t.assignee || '無'}) - 期限: ${t.dueDate} ${isOverdue ? '(🚨已逾期)' : ''} ${t.isManagerTask ? '(👑主管交辦)' : ''}\n進度數: ${t.logCount || 0}\n最近動態: ${recentComments}`;
            }).join('\n\n');
            currentAITask = 'shift_report';
            callGeminiAPI(`請幫我整理交班報告，以下是目前所有未完成的任務：\n\n${taskData}`, `你是一位專業的賣場交班助理。請根據提供的未完成任務，產生一份給『下一班次』的正式交班報告，務必總結最近動態的處理進度。`);
        }

        async function refineTaskDescWithAI() {
            const descInput = document.getElementById('taskDesc'), btn = document.getElementById('aiRefineBtn');
            const originalText = descInput.value.trim();
            if (!originalText) { showToast("請先輸入或語音錄製詳細內容！"); return; }
            
            if (!GEMINI_API_KEY || GEMINI_API_KEY === "請在這裡貼上你的Gemini金鑰") {
                showToast("請先在程式碼中填寫 Gemini API Key！", true);
                return;
            }

            const originalBtnHTML = btn.innerHTML; btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 整理中...`; btn.disabled = true;
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            try {
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: `請幫我把這段語音紀錄整理得更清楚：\n\n${originalText}` }] }], systemInstruction: { parts: [{ text: "你是一位細心的門市店長助理。請將使用者口語化的語音紀錄整理成條理清晰的交接說明，直接輸出整理後的文字。" }] } }) });
                const data = await response.json();
                if (data.candidates && data.candidates.length > 0) descInput.value = data.candidates[0].content.parts[0].text.trim();
                else showToast("AI 整理失敗", true);
            } catch (error) { showToast("發生錯誤，請檢查金鑰", true); } finally { btn.innerHTML = originalBtnHTML; btn.disabled = false; }
        }

        function saveShiftReport() {
            const report = { id: Date.now().toString(), timestamp: new Date().toISOString(), author: currentUserName || '系統', content: document.getElementById('aiResult').innerHTML };
            const btn = document.getElementById('saveShiftReportBtn');
            if (window.fbSaveShiftReport) {
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 儲存中...'; btn.disabled = true;
                window.fbSaveShiftReport(report).then(() => {
                    showToast("交班報告已正式封存！"); btn.innerHTML = '<i class="fa-solid fa-check"></i> 已封存至歷史紀錄'; btn.classList.replace('bg-purple-600', 'bg-green-500');
                }).catch(e => { showToast("封存失敗", true); btn.innerHTML = '<i class="fa-solid fa-box-archive mr-1"></i> 封存為正式交班紀錄'; btn.disabled = false; });
            } else { shiftReports.push(report); showToast("已存入本地歷史紀錄！"); btn.innerHTML = '<i class="fa-solid fa-check"></i> 已封存'; btn.classList.replace('bg-purple-600', 'bg-green-500'); btn.disabled = true; }
        }

        function renderCategorySelection() {
            const container = document.getElementById('dynamicCategorySelection');
            if (!container) return;
            container.innerHTML = categories.map((cat, index) => {
                const theme = COLOR_THEMES[cat.color] || COLOR_THEMES['gray'];
                return `<label class="cursor-pointer"><input type="radio" name="taskCategory" value="${escapeHTML(cat.id)}" class="peer sr-only" ${index === 0 ? 'checked' : ''}><div class="px-3 py-1.5 rounded-full text-sm border peer-checked:ring-2 peer-checked:ring-offset-1 transition font-bold ${theme.radio}">${escapeHTML(cat.label)}</div></label>`;
            }).join('');
        }

        function openSettingsModal() { 
            renderCategoryManager(); 
            renderQuickNames(); 
            renderAssignees(); 
            renderZones(); 
            document.getElementById('settingsModal').classList.remove('hidden'); 
            document.getElementById('settingsModal').classList.add('flex'); 
        }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); document.getElementById('settingsModal').classList.remove('flex'); }

        function renderCategoryManager() {
            const list = document.getElementById('categoryManagerList');
            list.innerHTML = categories.map(cat => {
                const theme = COLOR_THEMES[cat.color] || COLOR_THEMES['gray'];
                const deleteBtnHtml = currentUserRole === 'manager' ? `<button onclick="deleteCategory('${escapeHTML(cat.id)}')" class="text-gray-400 hover:text-red-500 p-2 transition"><i class="fa-solid fa-trash-can"></i></button>` : ``;
                return `<div class="flex justify-between items-center p-2 bg-gray-50 rounded-lg border border-gray-200"><span class="text-sm px-3 py-1 rounded-full border ${theme.badge} font-bold">${escapeHTML(cat.label)}</span>${deleteBtnHtml}</div>`;
            }).join('');
        }

        function addNewCategory() {
            const name = document.getElementById('newCategoryName').value.trim(), color = document.getElementById('newCategoryColor').value;
            if (!name) { showToast("請輸入分類名稱！", true); return; }
            categories.push({ id: 'cat_' + Date.now(), label: name, color: color });
            if (window.fbSaveCategories) window.fbSaveCategories(categories);
            document.getElementById('newCategoryName').value = ''; renderCategoryManager(); renderCategorySelection(); renderTasks(); 
        }

        function deleteCategory(id) {
            if (categories.length <= 1) { showToast("至少需要保留一個分類！", true); return; }
            if (tasks.some(t => t.category === id)) { openConfirmModal('確定要刪除嗎？', '刪除後，任務分類標籤會變成灰色的「已刪除分類」。', () => performCategoryDelete(id)); } 
            else { performCategoryDelete(id); }
        }
        function performCategoryDelete(id) {
            categories = categories.filter(c => c.id !== id);
            if (window.fbSaveCategories) window.fbSaveCategories(categories);
            renderCategoryManager(); renderCategorySelection(); renderTasks(); showToast("分類已刪除");
        }

        function renderQuickNames() {
            const container = document.getElementById('quickNameContainer');
            if (container) container.innerHTML = quickNames.map((name, index) => `<button onclick="quickSelectName(${index})" class="px-3 py-1.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-[#e6f0f7] hover:text-ikea-blue hover:border-blue-200 transition active:scale-95 shadow-sm font-bold">${escapeHTML(name)}</button>`).join('');
            const managerList = document.getElementById('quickNameManagerList');
            if (managerList) managerList.innerHTML = quickNames.map((name, index) => {
                const deleteBtnHtml = currentUserRole === 'manager' ? `<button onclick="deleteQuickName(${index})" class="ml-1.5 text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-circle-xmark"></i></button>` : ``;
                return `<div class="flex items-center bg-white border border-gray-200 px-3 py-1.5 rounded-lg text-sm text-gray-700 shadow-sm font-bold">${escapeHTML(name)} ${deleteBtnHtml}</div>`;
            }).join('');
        }

        function addNewQuickName() {
            const input = document.getElementById('newQuickName'), name = input.value.trim();
            if (!name) { showToast("請輸入登入代號名稱！", true); return; }
            if (quickNames.includes(name)) { showToast("此代號已經存在了！", true); return; }
            quickNames.push(name);
            if (window.fbSaveQuickNames) window.fbSaveQuickNames(quickNames);
            input.value = ''; renderQuickNames(); showToast("已新增常用登入代號");
        }

        function deleteQuickName(index) {
            quickNames.splice(index, 1);
            if (window.fbSaveQuickNames) window.fbSaveQuickNames(quickNames);
            renderQuickNames(); showToast("已刪除代號");
        }

        function renderAssignees() {
            // 將按鈕點擊後寫入 taskAssignee 輸入框
            const quickSelect = document.getElementById('assigneeQuickSelect');
            if (quickSelect) {
                quickSelect.innerHTML = assignees.map(a => `<button type="button" onclick="document.getElementById('taskAssignee').value='${escapeHTML(a)}'" class="px-3 py-1 bg-[#e6f0f7] text-ikea-blue border border-blue-200 rounded-full text-xs font-bold active:scale-95 transition shadow-sm">${escapeHTML(a)}</button>`).join('');
            }

            const managerList = document.getElementById('assigneeManagerList');
            if (managerList) {
                managerList.innerHTML = assignees.map((a, index) => {
                    const deleteBtnHtml = currentUserRole === 'manager' ? `<button onclick="deleteAssignee(${index})" class="ml-1.5 text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-circle-xmark"></i></button>` : ``;
                    return `<div class="flex items-center bg-white border border-gray-200 px-3 py-1.5 rounded-lg text-sm text-gray-700 shadow-sm font-bold">${escapeHTML(a)} ${deleteBtnHtml}</div>`;
                }).join('');
            }
        }

        function addNewAssignee() {
            const input = document.getElementById('newAssigneeInput');
            const name = input.value.trim();
            if (!name) { showToast("請輸入指派對象名稱！", true); return; }
            if (assignees.includes(name)) { showToast("此指派對象已經存在了！", true); return; }
            assignees.push(name);
            if (window.fbSaveAssignees) window.fbSaveAssignees(assignees);
            input.value = ''; renderAssignees(); showToast("已新增常見指派對象");
        }

        function deleteAssignee(index) {
            assignees.splice(index, 1);
            if (window.fbSaveAssignees) window.fbSaveAssignees(assignees);
            renderAssignees(); showToast("已刪除指派對象");
        }

        function renderZonesSelect(selectId) {
            const selectEl = document.getElementById(selectId);
            if (selectEl) {
                const currentVal = selectEl.value;
                selectEl.innerHTML = zones.map(z => `<option value="${escapeHTML(z)}">${escapeHTML(z)}</option>`).join('');
                if (currentVal && zones.includes(currentVal)) selectEl.value = currentVal;
                else if (zones.length > 0) selectEl.value = zones[0];
            }
        }

        function renderZones() {
            const managerList = document.getElementById('zoneManagerList');
            if (managerList) {
                managerList.innerHTML = zones.map((z, index) => {
                    const deleteBtnHtml = currentUserRole === 'manager' ? `<button onclick="deleteZone(${index})" class="ml-1.5 text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-circle-xmark"></i></button>` : ``;
                    return `<div class="flex items-center bg-white border border-gray-200 px-3 py-1.5 rounded-lg text-sm text-gray-700 shadow-sm font-bold">${escapeHTML(z)} ${deleteBtnHtml}</div>`;
                }).join('');
            }
        }

        function addNewZone() {
            const input = document.getElementById('newZoneInput');
            const name = input.value.trim();
            if (!name) { showToast("請輸入區域名稱！", true); return; }
            if (zones.includes(name)) { showToast("此區域已經存在了！", true); return; }
            zones.push(name);
            if (window.fbSaveZones) window.fbSaveZones(zones);
            input.value = ''; renderZones(); showToast("已新增任務區域");
        }

        function deleteZone(index) {
            if (zones.length <= 1) { showToast("至少需要保留一個區域！", true); return; }
            const zoneToDelete = zones[index];
            if (tasks.some(t => t.zone === zoneToDelete)) { 
                openConfirmModal('確定要刪除嗎？', '刪除後，舊任務在編輯時會顯示「已刪除」，但不影響歷史資料。', () => performZoneDelete(index)); 
            } else { performZoneDelete(index); }
        }

        function performZoneDelete(index) {
            zones.splice(index, 1);
            if (window.fbSaveZones) window.fbSaveZones(zones);
            renderZones(); showToast("已刪除任務區域");
        }

    </script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, deleteDoc, onSnapshot, collection, query, addDoc, memoryLocalCache, initializeFirestore } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 使用你的專案 ID 作為內部識別
        const appId = 'team-goal'; 
        
        // 替換為你的專屬 Firebase 金鑰
        const firebaseConfig = {
            apiKey: "AIzaSyDmmTXwQ0JbHa-U7FRKxdMv2wN8BqZZLhw",
            authDomain: "team-goal.firebaseapp.com",
            projectId: "team-goal",
            storageBucket: "team-goal.firebasestorage.app",
            messagingSenderId: "819425693121",
            appId: "1:819425693121:web:c55c547c854678ae4ef340",
            measurementId: "G-VFNQC619VQ"
        };
        
        let app, db, auth, currentUser;

        if (Object.keys(firebaseConfig).length > 0) {
            app = initializeApp(firebaseConfig);
            db = initializeFirestore(app, { localCache: memoryLocalCache() });
            auth = getAuth(app);
            
            const initAuth = async () => {
                try {
                    // 使用匿名登入
                    await signInAnonymously(auth);
                } catch (e) { console.error("Auth error:", e); }
            };
            initAuth();

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    currentUser = user; 
                    try {
                        const userDoc = await getDoc(doc(db, 'users', user.uid));
                        if(userDoc.exists() && userDoc.data().role) {
                            window.currentUserRole = userDoc.data().role;
                            document.getElementById('roleBtn').classList.add('hidden'); 
                        } 
                    } catch(e) {}
                    
                    const deleteBtn = document.querySelector('button[onclick="deleteCurrentTask()"]');
                    if(deleteBtn) {
                        if (window.currentUserRole === 'manager') deleteBtn.classList.remove('hidden');
                        else deleteBtn.classList.add('hidden');
                    }
                    window.renderCategoryManager();
                    window.renderQuickNames();
                    window.renderAssignees();
                    window.renderZones();

                    startAllSync();
                }
            });
        }

        function startAllSync() {
            startTaskSync(); 
            startCategorySync(); 
            startQuickNamesSync(); 
            startAssigneeSync(); 
            startZoneSync(); 
            startShiftReportSync();
        }

        function startTaskSync() {
            if (!currentUser) return;
            try {
                onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'tasks')), (snapshot) => {
                    window.tasks = [];
                    snapshot.forEach((doc) => { window.tasks.push(doc.data()); });
                    window.renderTasks();
                    if (window.currentEditingTaskId && document.getElementById('detailModal').classList.contains('flex')) {
                        const currentTask = window.tasks.find(t => t.id === window.currentEditingTaskId);
                        if (!currentTask) window.closeDetailModal(); 
                    }
                }, (error) => {});
            } catch(e) {}
        }

        window.fbLoadAuditLogs = function(taskId) {
            if (!currentUser || !db) return;
            if (window.currentAuditLogUnsubscribe) { window.currentAuditLogUnsubscribe(); window.currentAuditLogUnsubscribe = null; }
            try {
                window.currentAuditLogUnsubscribe = onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'tasks', taskId, 'auditLogs')), (snapshot) => {
                    let logsArray = [];
                    snapshot.forEach((doc) => { logsArray.push(doc.data()); });
                    if(document.getElementById('detailModal').classList.contains('flex') && window.currentEditingTaskId === taskId) {
                        window.renderProgress(logsArray);
                    }
                }, (error) => {});
            } catch(e) {}
        }

        function startCategorySync() {
            if (!currentUser) return;
            try {
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'categoriesData'), (docSnap) => {
                    if (docSnap.exists() && docSnap.data().list) {
                        window.categories = docSnap.data().list; window.renderCategoryManager(); window.renderCategorySelection(); window.renderTasks();
                    }
                }, (error) => {});
            } catch(e){}
        }

        function startQuickNamesSync() {
            if (!currentUser) return;
            try {
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'quickNamesData'), (docSnap) => {
                    if (docSnap.exists() && docSnap.data().list) { window.quickNames = docSnap.data().list; window.renderQuickNames(); }
                }, (error) => {});
            } catch(e){}
        }

        function startAssigneeSync() {
            if (!currentUser) return;
            try {
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'assigneesData'), (docSnap) => {
                    if (docSnap.exists() && docSnap.data().list) { 
                        window.assignees = docSnap.data().list; window.renderAssignees(); 
                    }
                }, (error) => {});
            } catch(e){}
        }

        function startZoneSync() {
            if (!currentUser) return;
            try {
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'zonesData'), (docSnap) => {
                    if (docSnap.exists() && docSnap.data().list) { 
                        window.zones = docSnap.data().list; window.renderZones(); 
                    }
                }, (error) => {});
            } catch(e){}
        }

        function startShiftReportSync() {
            if (!currentUser) return;
            try {
                onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'shiftReports')), (snapshot) => {
                    window.shiftReports = [];
                    snapshot.forEach((doc) => { window.shiftReports.push(doc.data()); });
                    window.shiftReports.sort((a,b) => new Date(b.timestamp).getTime() - new Date(a.timestamp).getTime());
                    if (window.renderShiftReportsList && document.getElementById('shiftReportsModal').classList.contains('flex')) window.renderShiftReportsList();
                }, (error) => {});
            } catch(e){}
        }

        window.renderShiftReportsList = function() {
            const list = document.getElementById('shiftReportsList');
            if(!list) return;
            if (window.shiftReports.length === 0) { list.innerHTML = '<div class="text-center text-gray-400 py-10"><i class="fa-solid fa-file-invoice text-4xl mb-3"></i><br>目前沒有歷史交班紀錄</div>'; return; }
            list.innerHTML = window.shiftReports.map(report => `
                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-3">
                    <div class="flex justify-between items-center mb-3 pb-2 border-b"><span class="font-bold text-gray-800 text-sm"><i class="fa-regular fa-clock mr-1 text-ikea-blue"></i> ${new Date(report.timestamp).toLocaleString('zh-TW')}</span><span class="text-xs bg-[#e6f0f7] text-ikea-blue px-2 py-0.5 rounded-full font-bold"><i class="fa-solid fa-user-pen mr-1"></i> ${escapeHTML(report.author)}</span></div>
                    <div class="markdown-body text-sm text-gray-700">${report.content}</div>
                </div>
            `).join('');
        };

        window.fbSaveTask = async (task) => { if (currentUser && db) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tasks', task.id), task).catch(e=>{}); };
        window.fbUpdateTask = async (task) => { if (currentUser && db) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tasks', task.id), task).catch(e => { if(window.showToast) window.showToast("更新失敗", true); }); };
        window.fbAppendAuditLog = async (taskId, logData) => { if (currentUser && db) await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'tasks', taskId, 'auditLogs'), logData).catch(e=>{}); };
        window.fbDeleteTask = async (taskId) => { if (currentUser && db) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tasks', taskId)).catch(e => { if(window.showToast) window.showToast("刪除失敗", true); }); };
        window.fbSaveCategories = async (newCategories) => { if (currentUser && db) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'categoriesData'), { list: newCategories }).catch(e=>{}); };
        window.fbSaveQuickNames = async (names) => { if (currentUser && db) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'quickNamesData'), { list: names }).catch(e=>{}); };
        window.fbSaveAssignees = async (list) => { if (currentUser && db) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'assigneesData'), { list: list }).catch(e=>{}); }; 
        window.fbSaveZones = async (list) => { if (currentUser && db) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'zonesData'), { list: list }).catch(e=>{}); }; 
        window.fbSaveShiftReport = async (report) => { if (currentUser && db) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shiftReports', report.id), report).catch(e => { if(window.showToast) window.showToast("封存報告失敗", true); throw e; }); };
    </script>
